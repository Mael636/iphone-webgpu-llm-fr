<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini-LLM FR (WebGPU)</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0b0b10;color:#eee;margin:0;padding:16px}
button{font-size:17px;padding:12px 16px;margin:4px 4px 4px 0;border-radius:10px;border:0;background:#3b82f6;color:#fff}
button.s{background:#444}
pre{background:#15151d;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px}
input{font-size:16px;padding:8px;width:100%;box-sizing:border-box;border-radius:8px;border:0}
</style>
</head>
<body>
<h2>Mini-LLM français sur iPhone</h2>
<div id="status">Initialisation…</div>
<div>
<button id="train">Entraîner</button>
<button id="stop" class="s">Pause</button>
<button id="save" class="s">Exporter</button>
</div>
<pre id="log"></pre>
<h3>Génération</h3>
<input id="prompt" value="Il était une fois">
<button id="gen">Générer</button>
<pre id="out"></pre>
<script type="module" src="main.js"></script>
</body>
</html>
